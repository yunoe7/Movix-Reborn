name: Pull request checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Focused lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint new VidRift integration components
        run: npx eslint src/components/VidRiftPlayer.tsx src/pages/AnimeRedirect.tsx
      - name: Lint Watch Party integration
        run: npx eslint src/components/ProfileMenu.tsx src/components/VidRiftPlayer.tsx src/pages/WatchPartyPage.tsx
      - name: Check WatchParty API syntax
        run: node --check API/watchpartyAPI/watchparty.js
      - name: Check WatchParty startup import resolution
        working-directory: API/watchpartyAPI
        run: node --input-type=module -e "import { existsSync, readFileSync } from 'node:fs'; import { pathToFileURL } from 'node:url'; const src = readFileSync('watchparty.js', 'utf8'); const match = src.match(/from\s+['\x22](\.\/voteMajority\.mjs)['\x22]/); if (!match) throw new Error('import voteMajority.mjs absent de watchparty.js'); const target = new URL(match[1], pathToFileURL(process.cwd() + '/watchparty.js')); if (!existsSync(target)) throw new Error('voteMajority.mjs introuvable au demarrage'); const mod = await import(target.href); if (typeof mod.isPauseVotePassed !== 'function') throw new Error('export isPauseVotePassed manquant'); console.log('WatchParty startup import OK:', match[1]);"
      - name: Build production bundle
        env:
          VITE_SITE_URL: https://movix.health
        run: npm run build
